# config.example.toml — committed template
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to config.toml (same directory) and fill in your paths.
# config.toml is gitignored so local and HPC paths stay out of the repo.
#
# Used by the `cesm-hawc` CLI:
#   cesm-hawc save-inputs --config config.toml --mode {fixed,orbit}
#   cesm-hawc run         --config config.toml --mode {fixed,orbit}
#
# Each run processes one model case and writes under out_dir/<name>/.
# ─────────────────────────────────────────────────────────────────────────────

# ── The model case (required, used by every mode) ─────────────────────────
[case]
name      = "my_case"                         # free-form label; output goes to out_dir/<name>/
# Directory of CAM history files. "{name}" is replaced by the case name
# (including a --case-name override), so one config can serve several
# cases stored side by side.
waccm_dir = "/path/to/archive/{name}/atm/hist/"
pattern   = "*.cam.h2.*.nc"                   # which files to read, e.g. "*.cam.h0.*.nc" for monthly
out_dir   = "~/results/cesm_hawc/"
n_workers = 4                                 # parallel worker processes; 1 = serial

time_index = 0          # time slice within each history file
start_date = ""         # optional date range ("YYYY-MM-DD"), "" = unbounded
end_date   = ""

run_l2      = false     # true = also run the L2 retrieval (slow: minutes per profile)
# true = zero WACCM ozone before building the simulated atmosphere (a
# diagnostic). Output goes to out_dir/<name>_no_ozone/ so it won't collide
# with a normal run of the same case. Also settable with `run --strip-ozone`.
strip_ozone = false

# ── Fixed tangent point (--mode fixed) ─────────────────────────────────────
# One column per history file at this location and solar geometry.
[fixed]
tangent_lat = 30.6    # degrees
tangent_lon = 180.0   # degrees, -180..180 or 0..360
sza_deg     = 60.0    # solar zenith angle at the tangent point
saa_deg     = 0.0     # solar azimuth angle at the tangent point
# obs_time = "2035-02-01T12:00:00Z"   # optional; by default taken from each file name

# ── Real orbit ground track (--mode orbit) ─────────────────────────────────
# Observations sampled along real HAWC orbit files, moved onto the case's
# dates: the n-th history-file date (sorted) uses orbit day n mod the number
# of orbit days.
[orbit]
orbit_dir     = "/path/to/orbit/files/"
orbit_pattern = "orbit_*.nc"
orbit_epoch   = "2019-08-01"   # time origin of the orbit file set
center_pixel  = 256            # across-track pixel used as the tangent point
obs_cadence_s = 60.0           # seconds between sampled observations

# "daily" (default) assumes one history file per calendar date. Use
# "subdaily" if output is written more than once per day (e.g. 12-hourly):
# one job then runs per file, with each observation matched to the nearest
# snapshot in time. With "daily", only one file per date would be kept.
h2_cadence    = "daily"

# ── ALI instrument configuration (every mode) ──────────────────────────────
[instrument]
# Simulated wavelengths [nm].
# 3-channel quick set:   [470.0, 745.0, 1020.0]
# Extended set:          [470.0, 525.0, 745.0, 1020.0, 1230.0, 1450.0, 1500.0]
wavelengths_nm   = [470.0, 745.0, 1020.0]
alt_grid_start_m = 0.0
alt_grid_stop_m  = 65000.0   # inclusive upper bound [m]
alt_grid_step_m  = 1000.0
