# config.example.toml — committed template
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to config.toml (same directory) and fill in your paths.
# config.toml is gitignored so local and HPC paths stay out of the repo.
# ─────────────────────────────────────────────────────────────────────────────

# ── Single-month run (scripts/run_simulation.py) ──────────────────────────
[single]
waccm_background = "/path/to/background.cam.h0.YYYY-MM.nc"
waccm_injection  = ""              # leave empty ("") to skip injection run
time_idx         = 0              # time slice index within the file
obs_time         = "2035-02-01T12:00:00Z"
out_dir          = "~/results/hawc_ali/"

# ── Batch run (scripts/run_simulation_all.py) ─────────────────────────────
[batch]
waccm_background_dir = "/path/to/background/atm/hist/"
waccm_injection_dir  = ""          # leave empty ("") to skip injection run
h0_pattern           = "*.cam.h0.*.nc"
month_filter         = []          # e.g. ["2034-01", "2034-02"]; [] = all months
out_dir              = "~/results/hawc_ali/"
n_workers            = 4          # parallel worker processes; 1 = serial

# ── Observation geometry (shared by both scripts) ─────────────────────────
[geometry]
tangent_lat = 30.6    # degrees — match your SO₂ injection latitude
tangent_lon = 180.0   # degrees
sza_deg     = 60.0
saa_deg     = 0.0

# ── CESM archive (for Figures A–C in plot_results_all.py) ────────────────
[cesm]
archive_dir  = "~/scratch/cesm/output/archive/"   # root containing <casename>/atm/hist/
bg_casename  = "sai_background_2035_001"
inj_casename = "sai_1.0Tg_2035_001"

# ── Plot display settings (shared by plot_results.py and plot_results_all.py) ─
[plots]
alt_min_km   = 5.0
alt_max_km   = 40.0
ref_alt_km   = 22.0    # reference line drawn on each panel (injection altitude)
strat_min_km = 15.0    # lower bound for stratospheric column integrals

# ── Orbit track run (scripts/run_orbit.py) ───────────────────────────────
[orbit]
# Hourly h1 input files (separate from [batch] monthly h0 files)
waccm_background_dir = "/path/to/background/atm/hist/"
waccm_injection_dir  = ""              # leave empty ("") to skip injection run
h2_pattern           = "*.cam.h2.*.nc"

# Simulation time range (ISO-8601). Leave empty to use all available files.
start_time = ""    # e.g. "2035-01-01T00:00:00Z"
end_time   = ""    # e.g. "2035-06-30T23:00:00Z"

# Analytical sun-synchronous orbit parameters (placeholder — swap in TLE later)
altitude_km     = 600.0   # orbit altitude [km]
inclination_deg = 98.0    # ~98° = sun-synchronous; adjust to match real orbit
start_lon_deg   = 0.0     # equator-crossing longitude at start_time [degrees]

# Observation cadence along the orbital track
obs_cadence_s = 60.0    # seconds between simulated observations

# Maximum allowed gap between an orbit timestamp and the nearest h1 file [s].
# Observations with no file within this tolerance are skipped.
max_gap_s = 1800.0    # 30 min

out_dir   = "~/results/hawc_ali_orbit/"
n_workers = 4          # parallel worker processes (by day); 1 = serial

# ── Real orbit file run (scripts/run_orbit_real.py) ──────────────────────
[orbit_real]
# Directory containing HAWC orbit NetCDF files (one file per orbit pass)
orbit_dir     = "/path/to/orbit/files/"
orbit_pattern = "orbit_*.nc"

# Daily WACCM h2 files — one file per calendar day
waccm_background_dir = "/path/to/background/atm/hist/"
waccm_injection_dir  = ""              # leave empty ("") to skip injection run
h2_pattern           = "*.cam.h2.*.nc"

out_dir   = "~/results/hawc_ali_orbit_real/"
n_workers = 4                          # parallel worker processes (by orbit file); 1 = serial

# Which across-track pixel indices to simulate.
# [] = all 512 pixels (slow); [256] = center pixel only (fast smoke test).
across_indices = [256]

# Process every Nth time step along the orbit. 1 = every second (~4218/orbit).
# Use 10 or 60 to subsample for faster runs.
time_stride = 1

# ── ALI instrument configuration (shared by both scripts) ─────────────────
[instrument]
# Wavelengths for the ideal spectrograph simulator [nm].
# 3-channel quickstart (fast):  [470.0, 745.0, 1020.0]
# Extended production set:      [470.0, 525.0, 745.0, 1020.0, 1230.0, 1450.0, 1500.0]
wavelengths_nm   = [470.0, 745.0, 1020.0]
# Noise model: set to a float to enable (e.g. 0.005), or leave empty ("") to disable.
noise_straylight_fraction = ""
alt_grid_start_m = 0.0
alt_grid_stop_m  = 65000.0   # inclusive upper bound [m]
alt_grid_step_m  = 1000.0
