name: hawc_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - sasktran2
  - xarray
  - scipy
  - numpy
  - matplotlib
  - pandas
  - cartopy
  - numba
  - dask
  # Installed from conda-forge so every compiled package shares conda's
  # OpenMP runtime; pip wheels of these bundle their own copy.
  - scikit-learn
  - pip
  - pip:
    - aliprocessing>=2026.10.0
    # hawcsimulator 2026.10 requires sasktran2 2026.10.1, which conda-forge
    # doesn't have yet; pip would replace conda's sasktran2 with a wheel.
    # Remove the upper bound once conda-forge has sasktran2 >= 2026.10.1.
    - hawcsimulator>=2026.6.0,<2026.10
