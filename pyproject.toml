[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cesm-hawc"
version = "0.2.0"
description = "Simulate HAWC ALI limb observations and retrievals from CESM2/WACCM output"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "xarray",
    "scipy",
    "pandas",
    "netCDF4",
    "dask",
]

[project.scripts]
cesm-hawc = "cesm_hawc.cli:main"

[project.optional-dependencies]
# End-to-end simulation (the `cesm-hawc run` CLI command / cesm_hawc.simulation
# / cesm_hawc.constituents). 
sim = [
    "aliprocessing>=2026.10.0",
    "hawcsimulator>=2026.6.0",
    "sasktran2",
]
dev = ["pytest", "jupyter", "matplotlib", "cartopy"]
docs = ["jupyter-book>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cesm_hawc = ["data/*.nc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D105", "D107"]  # magic methods; __init__ is documented on the class

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
